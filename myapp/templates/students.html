<tbody>

    {% for student in students %}

    <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.phone }}</td>
        <td>{{ student.created_at|date:"d.m.Y H:i" }}</td>

        <td>
            <a href="{% url 'students_update' student.pk %}">
                Redaktirovat
            </a>

            |

            <a href="{% url 'students_delete' student.pk %}">
                Udalit
            </a>
        </td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="6">
            Spisok studentov pust.
        </td>
    </tr>

    {% endfor %}

</tbody>
